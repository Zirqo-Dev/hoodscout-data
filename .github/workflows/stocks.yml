name: stocks
# No schedule: the scheduled collection runs inside collect.yml on its 30-min
# cadence. This workflow is the on-demand path -- ticker verification, and a
# manual stocks run when one is wanted off-cycle.
on:
  workflow_dispatch:
    inputs:
      verify_tickers:
        description: "Space-separated tickers to verify instead of collecting"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: stocks
  cancel-in-progress: false

jobs:
  stocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect
        env:
          VERIFY_TICKERS: ${{ inputs.verify_tickers }}
        run: |
          if [ -n "$VERIFY_TICKERS" ]; then
            python scripts/verify_stocks.py $VERIFY_TICKERS
          else
            python scripts/stocks.py
          fi
      - name: Commit
        run: |
          git config user.name "hoodscout-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "stocks: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash
            sleep 5
          done
          exit 1
      - name: Alert
        if: hashFiles('ALERT.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r line <&3; do
            [ -z "$line" ] && continue
            symbol=$(awk '{print $1}' <<< "$line")
            type=$(awk '{print $2}' <<< "$line")
            title="HoodScout alert: ${symbol} ${type}"

            mapfile -t issues < <(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "[.[] | select(.title == \"$title\") | .number] | sort | .[]")

            if [ -n "${issues[0]:-}" ]; then
              keep="${issues[0]}"
              # only write when the text actually differs: a standing condition
              # otherwise rewrites an identical body every single poll
              current=$(gh issue view "$keep" --json body --jq .body)
              if [ "$current" = "$line" ]; then
                echo "#$keep unchanged, skipping edit"
              else
                gh issue edit "$keep" --body "$line"
              fi
              for extra in "${issues[@]:1}"; do
                gh issue close "$extra" --comment "Duplicate of #$keep, closing."
              done
            else
              gh issue create --title "$title" --body "$line"
            fi
          done 3< ALERT.txt
