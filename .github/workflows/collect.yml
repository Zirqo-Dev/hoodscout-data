name: collect
# The schedule lives outside GitHub. cron-job.org calls workflow_dispatch at
# :00/:15/:30/:45 UTC; to change the cadence, change it there, not here.
#
# GitHub's own `schedule:` was removed on 2026-10-18, for two reasons.
#
# It did not deliver: of the eight fires nominally due between 21:56 and 23:58
# on 2026-10-17, one arrived, six minutes late, and nothing at all fired for
# the four hours after. Moving the crons off the peak minutes (7162f6b) made
# no difference, which ruled out contention as the explanation.
#
# And when it did deliver, it collided with the external dispatch. Run #1360
# was created 51 seconds after a dispatch, queued behind it on the concurrency
# group, and failed in Commit: whole-file rewrites of history.jsonl and
# latest.json cannot be rebased, so the retry loop had nothing to do. Two
# schedulers produce two near-identical snapshots and a guaranteed conflict
# whenever they land within a run's ~3 minute duration.
#
# To go back to a GitHub schedule, restore:
#   schedule:
#     - cron: "7,22,37,52 * * * *"
# and turn the cron-job.org job off first. Running both is what broke #1360.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Pinned, not latest: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and
    # this pipeline runs unattended, so an image swap would arrive as a red
    # run rather than as something anyone chose. Nothing here needs the
    # newer image: the only image-provided tools used are gh, git, bash and
    # coreutils, and setup-python fetches 3.11 from the tool cache -- which
    # is itself a reason to pin, rather than find out on the day whether 26
    # still ships it. Revisit before 24.04 leaves GitHub's supported set.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # main's tip at job start, not the SHA this run was triggered on.
          # actions/checkout defaults `ref` to "the reference or SHA for that
          # event", which is fixed when the run is created. A run that queues
          # behind another on the concurrency group therefore starts from a
          # commit that is already stale, pushes against a moved remote and is
          # rejected -- run #1360, 2026-10-18. Given a plain branch name,
          # getRefSpec fetches +refs/heads/main*:refs/remotes/origin/main* and
          # getCheckoutInfo checks out refs/remotes/origin/main, both at fetch
          # time, so the tree is whatever main is when the job actually starts.
          #
          # This removes the stale-checkout half of that race. It does not make
          # the Commit step below able to resolve a conflict, so two runs
          # genuinely overlapping in time can still collide.
          #
          # Side effect: a dispatch from another branch now runs this file from
          # that branch against main's contents. Nothing dispatches off main
          # today; if that changes, this is the line to revisit.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/collect.py
      # Same 30-min job rather than a separate */15 schedule: every condition
      # in stocks.alerts() works on 6h windows, level checks or a fixed anchor,
      # so 15-min resolution bought nothing. Running the two sequentially here
      # also stops them hitting the same GeckoTerminal endpoints at :00/:30,
      # which is what was rate-limiting the direct pool lookups.
      # continue-on-error so a stocks failure cannot cost collect its commit,
      # which is the isolation the separate workflows used to provide.
      - name: Stocks
        continue-on-error: true
        run: python scripts/stocks.py
      - name: Commit
        run: |
          git config user.name "hoodscout-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash
            sleep 5
          done
          echo "push failed after 5 attempts"; exit 1
      - name: Alert
        if: hashFiles('ALERT.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r line <&3; do
            [ -z "$line" ] && continue
            symbol=$(awk '{print $1}' <<< "$line")
            type=$(awk '{print $2}' <<< "$line")
            title="HoodScout alert: ${symbol} ${type}"

            mapfile -t issues < <(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "[.[] | select(.title == \"$title\") | .number] | sort | .[]")

            if [ -n "${issues[0]:-}" ]; then
              keep="${issues[0]}"
              # only write when the text actually differs: a standing condition
              # otherwise rewrites an identical body every single poll
              current=$(gh issue view "$keep" --json body --jq .body)
              if [ "$current" = "$line" ]; then
                echo "#$keep unchanged, skipping edit"
              else
                gh issue edit "$keep" --body "$line"
              fi
              for extra in "${issues[@]:1}"; do
                gh issue close "$extra" --comment "Duplicate of #$keep, closing."
              done
            else
              gh issue create --title "$title" --body "$line"
            fi
          done 3< ALERT.txt
