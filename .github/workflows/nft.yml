name: nft
on:
  schedule:
    - cron: "17 13,21 * * *"
  workflow_dispatch:
    inputs:
      verify_slugs:
        description: "Space-separated slugs to verify instead of collecting"
        required: false
        default: ""
      probe:
        description: "Dump raw discovery/detail responses to read field names"
        type: boolean
        required: false
        default: false
      discover:
        description: "Surface Robinhood Chain collections to data/nft_discover.json"
        type: boolean
        required: false
        default: false
      discover_order:
        description: "Ranking for discovery"
        type: choice
        required: false
        default: seven_day_volume
        options: [seven_day_volume, one_day_volume]

permissions:
  contents: write

concurrency:
  group: nft
  cancel-in-progress: false

jobs:
  nft:
    # Pinned, not latest: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and
    # this pipeline runs unattended, so an image swap would arrive as a red
    # run rather than as something anyone chose. Nothing here needs the
    # newer image: the only image-provided tools used are gh, git, bash and
    # coreutils, and setup-python fetches 3.11 from the tool cache -- which
    # is itself a reason to pin, rather than find out on the day whether 26
    # still ships it. Revisit before 24.04 leaves GitHub's supported set.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # main's tip at job start rather than the trigger SHA, so a queued
          # run never pushes from a stale checkout. See collect.yml for the
          # full reasoning and the caveats. A dispatch from another branch now
          # runs this file against main's contents.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect
        env:
          # optional: when set, nft.py uses it instead of minting a key per run
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          VERIFY_SLUGS: ${{ inputs.verify_slugs }}
          PROBE: ${{ inputs.probe }}
          DISCOVER: ${{ inputs.discover }}
          DISCOVER_ORDER: ${{ inputs.discover_order }}
        run: |
          if [ "$PROBE" = "true" ]; then
            python scripts/nft.py --probe
          elif [ "$DISCOVER" = "true" ]; then
            python scripts/nft.py --discover
          elif [ -n "$VERIFY_SLUGS" ]; then
            python scripts/nft.py --verify $VERIFY_SLUGS
          else
            # Scheduled run: one process, one minted key, both outputs.
            # Invoking the script twice minted two keys, and /auth/keys is
            # rate-limited hard enough that the extra mint 429'd -- killing
            # the run outright when it hit the tracked pass first.
            python scripts/nft.py --with-discover
          fi
      - name: Commit
        # always(): a discovery failure exits non-zero so the run goes red and
        # is visible, but the tracked data written before it must still land
        if: always()
        run: |
          git config user.name "hoodscout-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "nft: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash
            sleep 5
          done
          exit 1
