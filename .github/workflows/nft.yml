name: nft
on:
  schedule:
    - cron: "0 13,21 * * *"
  workflow_dispatch:
    inputs:
      verify_slugs:
        description: "Space-separated slugs to verify instead of collecting"
        required: false
        default: ""
      probe:
        description: "Dump raw discovery/detail responses to read field names"
        type: boolean
        required: false
        default: false
      discover:
        description: "Surface Robinhood Chain collections to data/nft_discover.json"
        type: boolean
        required: false
        default: false
      discover_order:
        description: "Ranking for discovery"
        type: choice
        required: false
        default: seven_day_volume
        options: [seven_day_volume, one_day_volume]

permissions:
  contents: write

concurrency:
  group: nft
  cancel-in-progress: false

jobs:
  nft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect
        env:
          VERIFY_SLUGS: ${{ inputs.verify_slugs }}
          PROBE: ${{ inputs.probe }}
          DISCOVER: ${{ inputs.discover }}
          DISCOVER_ORDER: ${{ inputs.discover_order }}
        run: |
          if [ "$PROBE" = "true" ]; then
            python scripts/nft.py --probe
          elif [ "$DISCOVER" = "true" ]; then
            python scripts/nft.py --discover
          elif [ -n "$VERIFY_SLUGS" ]; then
            python scripts/nft.py --verify $VERIFY_SLUGS
          else
            # Scheduled run. --discover is a separate invocation, not another
            # branch of this if: nft.py returns after whichever mode it matches,
            # so folding discover in here as an elif would silently stop
            # nft_latest.json and nft.jsonl updating. Tracked collections first,
            # since that is the output the alerts depend on; discover is
            # surfacing only and must not be able to fail the tracked run.
            python scripts/nft.py
            python scripts/nft.py --discover || echo "discover failed, tracked data still written"
          fi
      - name: Commit
        run: |
          git config user.name "hoodscout-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "nft: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash
            sleep 5
          done
          exit 1
